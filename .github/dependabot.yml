# Updates the pinned Actions, the Docker base image and the Python tools.
# "build" commits do not trigger a release.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    # From v7 the action warns on every run when the repository has no
    # package.json, and its skip_npm_plugin switch replaces the plugin list
    # in .releaserc.json, so the release stays on v6.
    ignore:
      - dependency-name: "cycjimmy/semantic-release-action"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/docker"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    open-pull-requests-limit: 5
    groups:
      python-tools:
        patterns: ["*"]
