# cppcheck and actionlint are pinned by ARG in the Dockerfile, out of
# Dependabot's reach, so once a week this checks them against their latest
# releases and fails, naming the tool, when one is behind.
name: Toolchain pins

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pins:
    name: Toolchain pins
    runs-on: ubuntu-26.04
    # Two API calls and a checkout; five minutes is a generous backstop, with
    # no run measured yet.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the Dockerfile's pins with the latest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh .github/scripts/check-toolchain-pins.sh Dockerfile
