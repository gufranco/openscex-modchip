name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Build and verify
    runs-on: ubuntu-26.04
    # Backstop, not a budget: the slowest of the last 15 green runs took 259 s,
    # toolchain image build included, so 20 minutes leaves room for a cold
    # runner and a slow registry while still ending a hung job long before
    # GitHub's 6-hour default.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build images, sizes, static analysis and tests in the pinned toolchain
        run: make all size analyse test

      - name: Verify reproducible build
        run: make repro

      - name: Mutation testing
        run: make mutate

      - name: Build other-region variants (compile check)
        run: make REGION=jp size && make REGION=eu size

      - name: Build and check the fixed-timing variant
        run: make TIMING=fixed size && make TIMING=fixed image_misra

      - name: Build and check the SCPH-5903 Video-CD variant
        run: make REGION=jp VCD_FILTER=on image_size image_misra

  # The console bench in a job of its own: it builds the same toolchain image,
  # then plays every scenario to this firmware and to PsNee, and fails on a
  # broken envelope rule, a showcase property ours fails, or code of ours
  # neither executed nor excused.
  bench:
    name: Console bench
    runs-on: ubuntu-26.04
    # Backstop from one measured run: the job took 22 min 44 s for three chips
    # and 27 scenarios (run 37847092399, 2026-10-08). The same chips with 33
    # scenarios, PsNee now skipping the sense-line walks, scale that to about
    # 28 minutes; 60 is that doubled with margin.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Console bench against PsNee
        run: make bench_ci

  # Runs on pull requests and on pushes to main, because releases are versioned
  # from these subjects and most changes land on main directly. Dependabot's own
  # pull requests are skipped; its commits are also skipped by author when they
  # are merged.
  commit-messages:
    name: Commit messages
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-26.04
    # The slowest of the last 15 green runs took 6 s.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate conventional commit subjects
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
        run: ./.github/scripts/check-commit-messages.sh "$BASE_SHA" "$HEAD_SHA"
