name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Build and verify
    runs-on: ubuntu-26.04
    # Backstop: the slowest of the last 15 green runs took 259 s, image build
    # included.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build images, sizes, static analysis and tests in the pinned toolchain
        run: make all size analyse test

      - name: Verify reproducible build
        run: make repro

      - name: Mutation testing
        run: make mutate

      - name: Build other-region variants (compile check)
        run: make REGION=jp size && make REGION=eu size

      # Both Video CD profiles ship, so both are checked.
      - name: Build and check the SCPH-5903 Video-CD variant
        run: >-
          make REGION=jp VCD_FILTER=on image_size image_misra &&
          make REGION=jp VCD_FILTER=on PROFILE=final image_size image_misra

  # Every scenario against this firmware and PsNee. Fails on a broken envelope
  # rule, a failed showcase property, or unexcused unexecuted code.
  bench:
    name: Console bench
    runs-on: ubuntu-26.04
    # Backstop: one run took 22 min 44 s for 27 scenarios, about 28 min for 33;
    # doubled with margin.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Console bench against PsNee
        run: make bench_ci

  # Releases are versioned from these subjects, so pushes to main are checked
  # too. Dependabot is skipped.
  commit-messages:
    name: Commit messages
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-26.04
    # The slowest of the last 15 green runs took 6 s.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate conventional commit subjects
        env:
          BASE_SHA: >-
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: >-
            ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
        run: ./.github/scripts/check-commit-messages.sh "$BASE_SHA" "$HEAD_SHA"
