name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Build and verify
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build images, sizes, static analysis and tests in the pinned toolchain
        run: make all size analyse test

      - name: Verify reproducible build
        run: make repro

      - name: Mutation testing
        run: make mutate

      - name: Build external-clock variant (compile check)
        run: make CLOCK=external size

      - name: Build other-region variants (compile check)
        run: make REGION=jp size && make REGION=eu size

      - name: Build and check the fixed-timing variant
        run: make TIMING=fixed size && make MCU=attiny85 TIMING=fixed image_misra

      - name: Build and check the ATtiny84 BIOS variants
        run: |
          make MCU=attiny84 BIOS=scph_102 image_size image_misra
          make MCU=attiny84 BIOS=scph_1000 image_size image_misra

  commit-messages:
    name: Commit messages
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate conventional commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./.github/scripts/check-commit-messages.sh "$BASE_SHA" "$HEAD_SHA"
