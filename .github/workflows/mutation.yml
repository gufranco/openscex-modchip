# Mutation of the platform C, run.c and engine.c, each mutant killed by the
# simulator suite. It plays every scenario once per mutant, so it runs only
# when the code it defends, the suite that kills it, the tool or the pinned
# toolchain that compiles and simulates it changes.
name: Platform mutation

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "tests/sim/**"
      - "tools/mutate.py"
      - "Makefile"
      - "Dockerfile"
      - "docker/**"
      - "tools/docker_make.py"
      - ".github/workflows/mutation.yml"
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "tests/sim/**"
      - "tools/mutate.py"
      - "Makefile"
      - "Dockerfile"
      - "docker/**"
      - "tools/docker_make.py"
      - ".github/workflows/mutation.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes its run. On main every run
# finishes, since a 74 min run cancelled by each push would leave main
# without a verdict on a busy day.
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutate-platform:
    name: Platform mutation
    runs-on: ubuntu-26.04
    # Backstop: the first CI run of 75 mutants took 74 min, image build
    # included, and a local run on two CPUs 77 min; about double the slower.
    timeout-minutes: 160
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Mutate run.c and engine.c against the simulator suite
        run: make mutate_platform
