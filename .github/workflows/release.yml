name: Release

# Releases a main commit whose CI passed, if main still points at it.
# semantic-release versions from commit subjects (feat minor, fix patch,
# BREAKING CHANGE major); a second job, which never runs npm, then builds,
# hashes and attests the images from the tag.
# To recover a tag that has no GitHub release, run it by hand with that tag.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag to publish, such as v0.8.0
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-26.04
    # contents: commit and tag. issues, pull-requests: release labels. This job
    # runs semantic-release, which installs npm packages with no lockfile, so it
    # gets no token that can sign provenance.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # Backstop: the slowest of the last 10 green runs took 243 s, build included.
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.semrel.outputs.new_release_git_tag || steps.recover.outputs.tag }}
    steps:
      - name: Checkout main, or the tag being recovered
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'main' }}
          fetch-depth: 0
          # Keeps the token out of .git/config, which the build container sees.
          persist-credentials: false

      - name: Recover a stranded tag
        id: recover
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "not a release tag: $TAG" >&2
            exit 1
          fi
          git rev-parse --verify --quiet "refs/tags/$TAG" > /dev/null
          version="${TAG#v}"
          awk -v v="$version" '
            /^# \[/ { if (on) exit; if (index($0, "# [" v "]") == 1) on = 1 }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "no CHANGELOG section for $version" >&2
            exit 1
          fi
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Confirm main is still the commit CI passed
        id: fresh
        if: github.event_name == 'workflow_run'
        env:
          PASSED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" = "$PASSED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main has moved past $PASSED_SHA; that commit's own CI run will release it"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run semantic-release
        id: semrel
        if: steps.fresh.outputs.current == 'true'
        # Held at v6.0.0: v7 warns about the npm plugin on every run, and its
        # skip_npm_plugin option would also drop changelog and git.
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90  # v6.0.0
        with:
          # Exact versions, since the action installs them with no lockfile.
          semantic_version: 25.0.9
          extra_plugins: |
            @semantic-release/changelog@7.0.0
            @semantic-release/git@11.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The toolchain image's bill of materials, made in a job with a read-only
  # token, since the SBOM action fetches Syft as it runs.
  sbom:
    name: Toolchain bill of materials
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    # The image build dominates; the CI gates job, image build included, has
    # not passed 259 s.
    timeout-minutes: 20
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - name: Build the pinned toolchain image
        id: toolchain
        run: |
          set -euo pipefail
          make image
          code='from pathlib import Path; from tools.docker_make import image_tag'
          tag="$(python3 -c "$code; print(image_tag(Path('.')))")"
          echo "image=$tag" >> "$GITHUB_OUTPUT"

      - name: Describe the toolchain image as SPDX
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ${{ steps.toolchain.outputs.image }}
          format: spdx-json
          output-file: toolchain.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Hand the SBOM to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: toolchain-sbom
          path: toolchain.spdx.json
          if-no-files-found: error

  publish:
    name: Build, attest and attach
    needs: [version, sbom]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-26.04
    # contents: upload the assets. id-token, attestations: build provenance.
    # Nothing in this job installs from npm.
    permissions:
      contents: write
      id-token: write
      attestations: write
    timeout-minutes: 20
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - name: Build the per-console SCEx images in the pinned toolchain
        run: |
          set -euo pipefail
          make REGION=us image
          make REGION=eu image
          make REGION=jp image
          make REGION=jp VCD_FILTER=on image
          make REGION=us PROFILE=final image
          make REGION=eu PROFILE=final image
          make REGION=jp PROFILE=final image
          make REGION=jp VCD_FILTER=on PROFILE=final image
          mkdir -p release-artifacts
          find build -type f -name '*.hex' -exec cp {} release-artifacts/ \;
          cp LICENSE release-artifacts/LICENSE.txt
          (cd release-artifacts && sha256sum ./*.hex > SHA256SUMS)
          ls -1 release-artifacts

      - name: Fetch the toolchain SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: toolchain-sbom
          path: release-artifacts

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            release-artifacts/*.hex
            release-artifacts/SHA256SUMS
            release-artifacts/LICENSE.txt

      - name: Attest the toolchain SBOM for the images
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e  # v4.1.0
        with:
          subject-path: release-artifacts/*.hex
          sbom-path: release-artifacts/toolchain.spdx.json

      - name: Attach the images to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" release-artifacts/*.hex \
            release-artifacts/SHA256SUMS release-artifacts/LICENSE.txt \
            release-artifacts/toolchain.spdx.json --clobber
