name: Release

# Releases a main commit once CI passed and, when the push changed what it
# defends, Platform mutation passed too, if main still points at it. Whichever
# of the two finishes last starts the release; the other run finds the commit
# not ready, or already released, and stops.
# semantic-release versions from commit subjects (feat minor, fix patch,
# BREAKING CHANGE major), installed from the lockfile in .github/release. The
# images are built, attested and attached by three later jobs, none of which
# runs npm, and only the attest job can sign.
# To recover a tag that has no GitHub release, or whose release is still a
# draft, run it by hand with that tag.
on:
  workflow_run:
    workflows: [CI, Platform mutation]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag to publish, such as v0.8.0
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Both workflows must have passed for the commit, from a push to main. A
  # mutation run that never started means the push changed nothing it
  # defends; one still running starts this workflow again when it ends.
  ready:
    name: Ready to release
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-26.04
    permissions:
      actions: read
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check CI and Platform mutation for the commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          latest() {
            gh api "repos/$REPO/actions/workflows/$1/runs?head_sha=$SHA&event=push" \
              --jq '.workflow_runs | sort_by(.run_number) | last
                    | if . == null then "none" else "\(.status)/\(.conclusion)" end'
          }
          ci="$(latest ci.yml)"
          mutation="$(latest mutation.yml)"
          echo "CI $ci, Platform mutation $mutation for $SHA"
          ready=false
          if [ "$ci" = "completed/success" ]; then
            case "$mutation" in
              none | completed/success) ready=true ;;
            esac
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

  # A tag pushed by an earlier run whose release is missing or still a draft.
  # The tag may only add the changelog to a commit whose CI passed and whose
  # Platform mutation, if it ran, passed too. A published release is never
  # touched again.
  recover:
    name: Recover
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: write
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.recover.outputs.tag }}
    steps:
      - name: Checkout the tag being recovered
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Recover a stranded tag
        id: recover
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "not a release tag: $TAG" >&2
            exit 1
          fi
          git rev-parse --verify --quiet "refs/tags/$TAG" > /dev/null
          if [ "$(git diff --name-only HEAD^ HEAD)" != "CHANGELOG.md" ]; then
            echo "$TAG changes more than CHANGELOG.md" >&2
            exit 1
          fi
          tested="$(git rev-parse HEAD^)"
          runs() {
            gh api "repos/$REPO/actions/workflows/$1/runs?head_sha=$tested&event=push" \
              --jq "[.workflow_runs[] | select($2)] | length"
          }
          if [ "$(runs ci.yml '.conclusion == "success"')" -eq 0 ]; then
            echo "CI never passed for $tested, the commit $TAG releases" >&2
            exit 1
          fi
          if [ "$(runs mutation.yml 'true')" -ne 0 ] \
            && [ "$(runs mutation.yml '.conclusion == "success"')" -eq 0 ]; then
            echo "Platform mutation ran for $tested and never passed" >&2
            exit 1
          fi
          if draft="$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft 2> /dev/null)"; then
            if [ "$draft" != "true" ]; then
              echo "$TAG is already published; a recovery never touches it" >&2
              exit 1
            fi
          else
            version="${TAG#v}"
            # semantic-release heads a minor or major version "# [x.y.z]" and
            # a patch "## [x.y.z]"; either level starts and ends a section.
            awk -v v="$version" '
              /^##? \[/ {
                if (on) exit
                if (index($0, "# [" v "]") == 1 || index($0, "## [" v "]") == 1) on = 1
              }
              on { print }
            ' CHANGELOG.md > release-notes.md
            if [ ! -s release-notes.md ]; then
              echo "no CHANGELOG section for $version" >&2
              exit 1
            fi
            gh release create "$TAG" --repo "$REPO" --draft --verify-tag --title "$TAG" \
              --notes-file release-notes.md
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  version:
    name: Version
    needs: ready
    if: needs.ready.outputs.ready == 'true'
    runs-on: ubuntu-26.04
    # contents: commit and tag. issues, pull-requests: release labels. This job
    # runs npm packages, from a lockfile, so it gets no token that can sign
    # provenance.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # Backstop: the slowest of the last 10 green runs took 243 s, build included.
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.semrel.outputs.tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          # Keeps the token out of .git/config, which the build container sees.
          persist-credentials: false

      - name: Confirm main is still the commit both workflows passed
        id: fresh
        env:
          PASSED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" = "$PASSED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main has moved past $PASSED_SHA; that commit's own runs will release it"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm
        if: steps.fresh.outputs.current == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          package_json_file: .github/release/package.json

      - name: Set up Node
        if: steps.fresh.outputs.current == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      - name: Install semantic-release from its lockfile
        if: steps.fresh.outputs.current == 'true'
        run: pnpm install --dir .github/release --frozen-lockfile --ignore-scripts

      # semantic-release tags the changelog commit it pushes, so a tag on HEAD
      # afterwards is the new release; none means nothing was releasable.
      - name: Run semantic-release
        id: semrel
        if: steps.fresh.outputs.current == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          .github/release/node_modules/.bin/semantic-release
          tag="$(git tag --points-at HEAD --list 'v*')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Builds the toolchain image once, describes it as SPDX and builds every
  # release image with it, so the bill of materials names the tools that
  # made these exact files. The token here can only read.
  build:
    name: Build the release images
    needs: [version, recover]
    # Only one of version and recover runs; the other is skipped, which is
    # not a failure, so the job waits on both and runs when either gave a tag.
    if: >-
      always() && !cancelled() && !failure() &&
      (needs.version.outputs.tag != '' || needs.recover.outputs.tag != '')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    # The image build dominates; the CI gates job, image build included, has
    # not passed 259 s.
    timeout-minutes: 20
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag || needs.recover.outputs.tag }}
          # The tag and its parent, for the check below.
          fetch-depth: 2
          persist-credentials: false

      # The version job ran npm packages with write access, so the tag is not
      # taken on trust: it may only add the changelog to its parent, and on a
      # workflow-triggered run that parent must be the commit both workflows
      # passed. The recover job checked a recovered tag's parent itself.
      - name: Confirm the tag only adds the changelog to a tested commit
        env:
          EVENT: ${{ github.event_name }}
          PASSED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD^ HEAD)"
          if [ "$changed" != "CHANGELOG.md" ]; then
            echo "the release tag changes more than CHANGELOG.md: $changed" >&2
            exit 1
          fi
          if [ "$EVENT" = "workflow_run" ] && [ "$(git rev-parse HEAD^)" != "$PASSED_SHA" ]; then
            echo "the release tag does not sit on the commit both workflows passed, $PASSED_SHA" >&2
            exit 1
          fi

      - name: Build the pinned toolchain image
        id: toolchain
        run: |
          set -euo pipefail
          make image
          code='from pathlib import Path; from tools.docker_make import image_tag'
          tag="$(python3 -c "$code; print(image_tag(Path('.')))")"
          echo "image=$tag" >> "$GITHUB_OUTPUT"

      - name: Describe the toolchain image as SPDX
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        env:
          # Syft's package-to-file links list every file each Debian package
          # owns: 20 MB for this image. Without them it is 1.9 MB and names the
          # same 333 packages.
          SYFT_RELATIONSHIPS_PACKAGE_FILE_OWNERSHIP: "false"
        with:
          image: ${{ steps.toolchain.outputs.image }}
          format: spdx-json
          output-file: toolchain.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Build the per-console SCEx images in that toolchain
        run: |
          set -euo pipefail
          make release_images
          mkdir -p release-artifacts
          find build -type f -name '*.hex' -exec cp {} release-artifacts/ \;
          cp LICENSE release-artifacts/LICENSE.txt
          mv toolchain.spdx.json release-artifacts/
          (cd release-artifacts && sha256sum ./*.hex > SHA256SUMS)
          ls -1 release-artifacts

      - name: Hand the release files to the attest and publish jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-files
          path: release-artifacts
          if-no-files-found: error

  # Signs build provenance for every released file, the toolchain SBOM
  # included, so it is attested as the record of the build environment, not
  # as the contents of the images. Nothing here builds or runs project code.
  attest:
    name: Attest
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
      attestations: write
    timeout-minutes: 10
    steps:
      - name: Fetch the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-files
          path: release-artifacts

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: |
            release-artifacts/*.hex
            release-artifacts/SHA256SUMS
            release-artifacts/LICENSE.txt
            release-artifacts/toolchain.spdx.json

  publish:
    name: Attach and publish
    needs: [version, recover, attest]
    if: >-
      always() && !cancelled() && !failure() &&
      (needs.version.outputs.tag != '' || needs.recover.outputs.tag != '')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Fetch the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-files
          path: release-artifacts

      # The release is created as a draft, so nobody can download a version
      # with no images; it is published only once every asset is attached, and
      # a release already published is never written to.
      - name: Attach the images and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag || needs.recover.outputs.tag }}
        run: |
          set -euo pipefail
          draft="$(gh release view "$RELEASE_TAG" --repo "$REPO" --json isDraft --jq .isDraft)"
          if [ "$draft" != "true" ]; then
            echo "$RELEASE_TAG is already published; its assets are left as they are" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" --repo "$REPO" release-artifacts/*.hex \
            release-artifacts/SHA256SUMS release-artifacts/LICENSE.txt \
            release-artifacts/toolchain.spdx.json --clobber
          gh release edit "$RELEASE_TAG" --repo "$REPO" --draft=false
